AWSTemplateFormatVersion: '2010-09-09'
Description: 'DeVine IAM - Role, Instance Profile, Policies, Users'

Parameters:
  Environment:
    Type: String
    Default: prod
  PublicBucketName:
    Type: String
  PrivateBucketName:
    Type: String

Resources:
  # --- Managed Policies ---
  DevinePrivateBucketPolicy:
    DeletionPolicy: Delete
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: devine-private-bucket-policy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:ListBucket
            Resource:
              - !Sub 'arn:aws:s3:::${PrivateBucketName}'
              - !Sub 'arn:aws:s3:::${PrivateBucketName}/config/*'

  DevinePublicBucketPolicy:
    DeletionPolicy: Delete
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: devine-public-bucket-policy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:DeleteObject
            Resource: !Sub 'arn:aws:s3:::${PublicBucketName}/*'


  StorageLensViewerPolicy:
    DeletionPolicy: Delete
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: StorageLensViewerPolicy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:ListStorageLensConfigurations
              - s3:GetStorageLensConfiguration
              - s3:GetStorageLensDashboard
            Resource: '*'

  # --- Role & Instance Profile ---
  DevineS3Role:
    DeletionPolicy: Delete
    Type: AWS::IAM::Role
    Properties:
      RoleName: devine-s3-role
      Description: Allows EC2 instances to call AWS services on your behalf.
      Path: /
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - !Ref DevinePrivateBucketPolicy
        - !Ref DevinePublicBucketPolicy

  DevineInstanceProfile:
    DeletionPolicy: Delete
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      InstanceProfileName: devine-s3-role
      Roles:
        - !Ref DevineS3Role

  # --- Users ---
  DevineAdminUser:
    DeletionPolicy: Delete
    Type: AWS::IAM::User
    Properties:
      UserName: devine-admin
      Path: /
      ManagedPolicyArns:
        - !Ref StorageLensViewerPolicy
        - arn:aws:iam::aws:policy/AdministratorAccess

  DevineS3OnlyUser:
    DeletionPolicy: Delete
    Type: AWS::IAM::User
    Properties:
      UserName: devine-s3-only
      Path: /
      ManagedPolicyArns:
        - !Ref DevinePrivateBucketPolicy
        - !Ref DevinePublicBucketPolicy

  DevineHeoUser:
    DeletionPolicy: Retain
    Type: AWS::IAM::User
    Properties:
      UserName: devine-heo
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
        - arn:aws:iam::aws:policy/IAMUserChangePassword

  DevineStrfunctionkUser:
    DeletionPolicy: Retain
    Type: AWS::IAM::User
    Properties:
      UserName: devine-strfunctionk
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
        - arn:aws:iam::aws:policy/IAMUserChangePassword

  DevineSunUser:
    DeletionPolicy: Retain
    Type: AWS::IAM::User
    Properties:
      UserName: devine-sun
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
        - arn:aws:iam::aws:policy/IAMUserChangePassword

  DevineFormerUser:
    DeletionPolicy: Delete
    Type: AWS::IAM::User
    Properties:
      UserName: devine-former
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess

Outputs:
  InstanceProfileName:
    Value: !Ref DevineInstanceProfile
    Export:
      Name: !Sub devine-${Environment}-instance-profile
