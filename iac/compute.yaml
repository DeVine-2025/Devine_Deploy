AWSTemplateFormatVersion: '2010-09-09'
Description: 'DeVine Compute - EC2 Instances, EIP, KeyPair'

Parameters:
  KeyName:
    Type: String
  PublicSubnet1Id:
    Type: String
  PublicSubnet2Id:
    Type: String
  PrivateSubnetDbId:
    Type: String
  AppSecurityGroupId:
    Type: String
  DbSecurityGroupId:
    Type: String
  InstanceProfileName:
    Type: String

Resources:
  ProdEIP:
    DeletionPolicy: Delete
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: devine-prod-eip

  ProdInstance:
    DeletionPolicy: Delete
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: ami-0596f7562954deb8e
      KeyName: !Ref KeyName
      SubnetId: !Ref PublicSubnet1Id
      SecurityGroupIds:
        - !Ref AppSecurityGroupId
      IamInstanceProfile: !Ref InstanceProfileName
      EbsOptimized: true
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: 30
            Iops: 3000
            DeleteOnTermination: true
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 2
        HttpEndpoint: enabled
      Tags:
        - Key: Name
          Value: devine-prod-instance
      CreditSpecification:
        CPUCredits: standard

  PrivateInstance:
    DeletionPolicy: Delete
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: ami-0596f7562954deb8e
      KeyName: !Ref KeyName
      SubnetId: !Ref PrivateSubnetDbId
      SecurityGroupIds:
        - !Ref DbSecurityGroupId
      IamInstanceProfile: !Ref InstanceProfileName
      EbsOptimized: true
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: 20
            Iops: 3000
            DeleteOnTermination: true
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 2
        HttpEndpoint: enabled
      Tags:
        - Key: Name
          Value: devine-private-instance
      CreditSpecification:
        CPUCredits: standard

  ProdEIPAssociation:
    DeletionPolicy: Delete
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ProdEIP.AllocationId
      InstanceId: !Ref ProdInstance

Outputs:
  ProdInstanceId:
    Value: !Ref ProdInstance
  PrivateInstanceId:
    Value: !Ref PrivateInstance
  ProdPublicIP:
    Value: !Ref ProdEIP
  ProdEIPPublicIp:
    Value: !GetAtt ProdEIP.PublicIp
