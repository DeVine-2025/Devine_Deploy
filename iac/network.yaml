AWSTemplateFormatVersion: '2010-09-09'
Description: 'DeVine Network - VPC, Subnets, IGW, NAT Gateway, Route Tables'

Parameters:
  Environment:
    Type: String
  VpcCidr:
    Type: String
  PublicSubnet1Cidr:
    Type: String
  PublicSubnet2Cidr:
    Type: String
  PrivateSubnetApp1Cidr:
    Type: String
  PrivateSubnetApp2Cidr:
    Type: String
  PrivateSubnetDbCidr:
    Type: String
  AZ1:
    Type: AWS::EC2::AvailabilityZone::Name
  AZ2:
    Type: AWS::EC2::AvailabilityZone::Name

Resources:
  VPC:
    DeletionPolicy: Retain
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub devine-vpc-${Environment}

  InternetGateway:
    DeletionPolicy: Retain
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub devine-igw-${Environment}

  IGWAttachment:
    DeletionPolicy: Retain
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # --- Subnets ---
  PublicSubnet1:
    DeletionPolicy: Retain
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Ref AZ1
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub devine-public-a-${Environment}

  PublicSubnet2:
    DeletionPolicy: Retain
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Ref AZ2
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub devine-public-c-${Environment}

  PrivateSubnetApp1:
    DeletionPolicy: Retain
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnetApp1Cidr
      AvailabilityZone: !Ref AZ1
      Tags:
        - Key: Name
          Value: !Sub devine-private-app-a-${Environment}

  PrivateSubnetApp2:
    DeletionPolicy: Retain
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnetApp2Cidr
      AvailabilityZone: !Ref AZ2
      Tags:
        - Key: Name
          Value: !Sub devine-private-app-c-${Environment}

  PrivateSubnetDb:
    DeletionPolicy: Retain
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnetDbCidr
      AvailabilityZone: !Ref AZ1
      Tags:
        - Key: Name
          Value: !Sub devine-private-db-a-${Environment}

  # --- Route Tables - Public ---
  PublicRouteTable:
    DeletionPolicy: Retain
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub devine-public-rt-${Environment}

  PublicRoute:
    DeletionPolicy: Retain
    Type: AWS::EC2::Route
    DependsOn: IGWAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RTAssoc:
    DeletionPolicy: Retain
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RTAssoc:
    DeletionPolicy: Retain
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # --- Route Tables - Private ---
  PrivateRouteTable:
    DeletionPolicy: Retain
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub devine-private-rt-${Environment}

  PrivateSubnetApp1RTAssoc:
    DeletionPolicy: Retain
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetApp1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetApp2RTAssoc:
    DeletionPolicy: Retain
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetApp2
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetDbRTAssoc:
    DeletionPolicy: Retain
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetDb
      RouteTableId: !Ref PrivateRouteTable

Outputs:
  VpcId:
    Value: !Ref VPC
    Export:
      Name: !Sub devine-${Environment}-vpc-id
  VpcCidr:
    Value: !Ref VpcCidr
    Export:
      Name: !Sub devine-${Environment}-vpc-cidr
  PublicSubnet1Id:
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub devine-${Environment}-public-subnet-a
  PublicSubnet2Id:
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub devine-${Environment}-public-subnet-c
  PrivateSubnetApp1Id:
    Value: !Ref PrivateSubnetApp1
    Export:
      Name: !Sub devine-${Environment}-private-app-subnet-a
  PrivateSubnetApp2Id:
    Value: !Ref PrivateSubnetApp2
    Export:
      Name: !Sub devine-${Environment}-private-app-subnet-c
  PrivateSubnetDbId:
    Value: !Ref PrivateSubnetDb
    Export:
      Name: !Sub devine-${Environment}-private-db-subnet
