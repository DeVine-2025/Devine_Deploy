services:
  nginx:
    image: nginx:latest
    container_name: devine-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d  # Nginx 설정 파일
      - ./nginx/ssl:/etc/nginx/ssl        # SSL 인증서 파일
      - ./nginx/log:/var/log/nginx        # 로그 파일
    depends_on:
      api:
        condition: service_healthy
      realtime:
        condition: service_healthy
    networks:
      - devine-network

  api:
    image: ${DOCKER_USERNAME}/devine-api:${DOCKER_IMAGE_TAG:-latest}
    container_name: devine-api
    restart: unless-stopped
    expose:
      - "${API_PORT}"
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${API_PORT}/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - devine-network
    volumes:
      - ./logs/api:/app/logs

  realtime:
    image: ${DOCKER_USERNAME}/devine-realtime:${DOCKER_IMAGE_TAG:-latest}
    container_name: devine-realtime
    restart: unless-stopped
    expose:
      - "${REALTIME_PORT}"
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${REALTIME_PORT}/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - devine-network
    volumes:
      - ./logs/realtime:/app/logs

  ai:
    image: ${DOCKER_USERNAME}/devine-ai:${DOCKER_IMAGE_TAG:-latest}
    container_name: devine-ai
    restart: unless-stopped
    expose:
      - "${FAST_PORT}"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Seoul
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${FAST_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - devine-network
    volumes:
      - ./logs/ai:/app/logs

networks:
  devine-network:
    driver: bridge