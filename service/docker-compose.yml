services:
  nginx:
    image: nginx:1.27-alpine
    container_name: devine-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d  # Nginx 설정 파일
      - ./nginx/ssl:/etc/nginx/ssl        # SSL 인증서 파일
      - ./nginx/log:/var/log/nginx        # 로그 파일
    networks:
      - devine-network

  # ===== Backend Blue/Green =====
  backend-blue:
    image: ${DOCKER_USERNAME}/devine-backend:${BACKEND_BLUE_TAG:-latest}
    container_name: devine-backend-blue
    restart: unless-stopped
    expose:
      - "${SPRING_PORT}"
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${SPRING_PORT}/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - devine-network
    volumes:
      - ./logs/backend:/app/logs
    profiles: ["backend-blue"]

  backend-green:
    image: ${DOCKER_USERNAME}/devine-backend:${BACKEND_GREEN_TAG:-latest}
    container_name: devine-backend-green
    restart: unless-stopped
    expose:
      - "${SPRING_PORT}"
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${SPRING_PORT}/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - devine-network
    volumes:
      - ./logs/backend:/app/logs
    profiles: ["backend-green"]

  # ===== AI Blue/Green =====
  ai-blue:
    image: ${DOCKER_USERNAME}/devine-ai:${AI_BLUE_TAG:-latest}
    container_name: devine-ai-blue
    restart: unless-stopped
    expose:
      - "${FAST_PORT}"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Seoul
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${FAST_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - devine-network
    volumes:
      - ./logs/ai:/app/logs
    profiles: ["ai-blue"]

  ai-green:
    image: ${DOCKER_USERNAME}/devine-ai:${AI_GREEN_TAG:-latest}
    container_name: devine-ai-green
    restart: unless-stopped
    expose:
      - "${FAST_PORT}"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Seoul
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${FAST_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - devine-network
    volumes:
      - ./logs/ai:/app/logs
    profiles: ["ai-green"]

networks:
  devine-network:
    driver: bridge
